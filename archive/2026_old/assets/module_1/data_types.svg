<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Numeric continuous -->
  <g transform="translate(10,10)">
    <rect width="300" height="180" rx="14" fill="#2980b9"/>
    <text x="20" y="35" font-size="22" font-weight="700" fill="#ffffff">Numeric</text>
    <text x="20" y="58" font-size="13" fill="#ffffff" opacity="0.9">(continuous)</text>
    <text x="20" y="100" font-size="18" fill="#ffffff" font-family="Courier New, monospace">21.4 U/L</text>
    <text x="20" y="135" font-size="13" fill="#ffffff" opacity="0.9">arbitrary decimal precision</text>
    <text x="20" y="155" font-size="13" fill="#ffffff" opacity="0.9">supports mean, sd, range</text>
  </g>

  <!-- Numeric integer -->
  <g transform="translate(340,10)">
    <rect width="300" height="180" rx="14" fill="#2471a3"/>
    <text x="20" y="35" font-size="22" font-weight="700" fill="#ffffff">Numeric</text>
    <text x="20" y="58" font-size="13" fill="#ffffff" opacity="0.9">(integer / count)</text>
    <text x="20" y="100" font-size="18" fill="#ffffff" font-family="Courier New, monospace">51 years</text>
    <text x="20" y="135" font-size="13" fill="#ffffff" opacity="0.9">whole numbers only</text>
    <text x="20" y="155" font-size="13" fill="#ffffff" opacity="0.9">e.g. age, n</text>
  </g>

  <!-- Categorical -->
  <g transform="translate(670,10)">
    <rect width="300" height="180" rx="14" fill="#16a085"/>
    <text x="20" y="35" font-size="22" font-weight="700" fill="#ffffff">Categorical</text>
    <text x="20" y="58" font-size="13" fill="#ffffff" opacity="0.9">(nominal)</text>
    <text x="20" y="100" font-size="18" fill="#ffffff" font-family="Courier New, monospace">"outpatient"</text>
    <text x="20" y="135" font-size="13" fill="#ffffff" opacity="0.9">fixed set of labels</text>
    <text x="20" y="155" font-size="13" fill="#ffffff" opacity="0.9">no inherent order</text>
  </g>

  <!-- Ordinal -->
  <g transform="translate(10,210)">
    <rect width="300" height="180" rx="14" fill="#138d75"/>
    <text x="20" y="35" font-size="22" font-weight="700" fill="#ffffff">Ordinal</text>
    <text x="20" y="58" font-size="13" fill="#ffffff" opacity="0.9">(ordered categories)</text>
    <text x="20" y="100" font-size="16" fill="#ffffff" font-family="Courier New, monospace">"1+" &lt; "2+" &lt; "3+"</text>
    <text x="20" y="135" font-size="13" fill="#ffffff" opacity="0.9">categories with meaningful order</text>
    <text x="20" y="155" font-size="13" fill="#ffffff" opacity="0.9">e.g. urinalysis grading</text>
  </g>

  <!-- Datetime -->
  <g transform="translate(340,210)">
    <rect width="300" height="180" rx="14" fill="#d35400"/>
    <text x="20" y="35" font-size="22" font-weight="700" fill="#ffffff">Datetime</text>
    <text x="20" y="58" font-size="13" fill="#ffffff" opacity="0.9">(format-dependent)</text>
    <text x="20" y="100" font-size="15" fill="#ffffff" font-family="Courier New, monospace">2022/12/26 11:28:10</text>
    <text x="20" y="135" font-size="13" fill="#ffffff" opacity="0.9">software must be told the format</text>
    <text x="20" y="155" font-size="13" fill="#ffffff" opacity="0.9">ambiguous without one</text>
  </g>

  <!-- Boolean -->
  <g transform="translate(670,210)">
    <rect width="300" height="180" rx="14" fill="#7f8c8d"/>
    <text x="20" y="35" font-size="22" font-weight="700" fill="#ffffff">Boolean</text>
    <text x="20" y="58" font-size="13" fill="#ffffff" opacity="0.9">(logical)</text>
    <text x="20" y="100" font-size="18" fill="#ffffff" font-family="Courier New, monospace">TRUE / FALSE</text>
    <text x="20" y="135" font-size="13" fill="#ffffff" opacity="0.9">exactly two states</text>
    <text x="20" y="155" font-size="13" fill="#ffffff" opacity="0.9">e.g. sample_passed</text>
  </g>
</svg>
