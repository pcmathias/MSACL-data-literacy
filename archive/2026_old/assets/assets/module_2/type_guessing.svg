<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Helvetica, Arial, sans-serif">
  <!-- Raw column -->
  <g transform="translate(20,30)">
    <rect width="280" height="240" rx="10" fill="#f4f8fb" stroke="#2980b9" stroke-width="2"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#2c3e50">collect_dt (raw)</text>
    <text x="20" y="70" font-size="13" font-family="Courier New, monospace" fill="#566573">"2022/12/26 00:24:02"</text>
    <text x="20" y="95" font-size="13" font-family="Courier New, monospace" fill="#566573">"2022/12/26 01:12:40"</text>
    <text x="20" y="120" font-size="13" font-family="Courier New, monospace" fill="#566573">"2022/12/27 09:03:15"</text>
    <text x="20" y="160" font-size="13" fill="#7f8c8d" font-style="italic">Just text to a computer —</text>
    <text x="20" y="180" font-size="13" fill="#7f8c8d" font-style="italic">nothing marks it as a date.</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(330,140)">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#7f8c8d" stroke-width="3"/>
    <polygon points="90,-8 106,0 90,8" fill="#7f8c8d"/>
  </g>

  <!-- Default guess (wrong) -->
  <g transform="translate(450,30)">
    <rect width="260" height="110" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="18" y="30" font-size="14" font-weight="700" fill="#922b21">read_csv() default guess</text>
    <text x="18" y="60" font-size="13" font-family="Courier New, monospace" fill="#922b21">&lt;character&gt;</text>
    <text x="18" y="85" font-size="12" fill="#922b21">Can't sort, filter by date,</text>
    <text x="18" y="100" font-size="12" fill="#922b21">or compute a duration</text>
  </g>

  <!-- Explicit type (correct) -->
  <g transform="translate(450,170)">
    <rect width="260" height="110" rx="10" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
    <text x="18" y="30" font-size="14" font-weight="700" fill="#196f3d">col_datetime(format) told</text>
    <text x="18" y="60" font-size="13" font-family="Courier New, monospace" fill="#196f3d">&lt;dttm&gt;</text>
    <text x="18" y="85" font-size="12" fill="#196f3d">Now supports arithmetic,</text>
    <text x="18" y="100" font-size="12" fill="#196f3d">sorting, and duration math</text>
  </g>

  <!-- Bottom label -->
  <g transform="translate(750,60)">
    <text x="0" y="0" font-size="14" fill="#2c3e50" font-weight="700">Same 21 characters.</text>
    <text x="0" y="24" font-size="14" fill="#2c3e50" font-weight="700">Two completely different</text>
    <text x="0" y="48" font-size="14" fill="#2c3e50" font-weight="700">sets of what you can do.</text>
  </g>
</svg>
