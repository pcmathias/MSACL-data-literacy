<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" font-family="Helvetica, Arial, sans-serif">
  <!-- Root project box -->
  <rect x="20" y="20" width="220" height="50" rx="8" fill="#f4d03f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="35" y="52" font-size="17" font-family="Courier New, monospace" font-weight="bold" fill="#2c3e50">my_project/</text>

  <!-- connecting spine -->
  <line x1="60" y1="70" x2="60" y2="300" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Rproj file -->
  <line x1="60" y1="110" x2="80" y2="110" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="80" y="90" width="260" height="40" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="95" y="116" font-size="17" font-family="Courier New, monospace" fill="#2c3e50">my_project.Rproj</text>
  <text x="360" y="116" font-size="14" fill="#566573">anchors all relative paths</text>

  <!-- data/ -->
  <line x1="60" y1="170" x2="80" y2="170" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="80" y="150" width="180" height="40" rx="6" fill="#85c1e9" stroke="#2874a6" stroke-width="1.5"/>
  <text x="95" y="176" font-size="17" font-family="Courier New, monospace" font-weight="bold" fill="#2c3e50">data/</text>
  <text x="360" y="176" font-size="14" fill="#566573">raw files — never edit by hand</text>

  <!-- R/ -->
  <line x1="60" y1="225" x2="80" y2="225" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="80" y="205" width="180" height="40" rx="6" fill="#82e0aa" stroke="#1e8449" stroke-width="1.5"/>
  <text x="95" y="231" font-size="17" font-family="Courier New, monospace" font-weight="bold" fill="#2c3e50">R/</text>
  <text x="360" y="231" font-size="14" fill="#566573">scripts and analysis code live here</text>

  <!-- output/ -->
  <line x1="60" y1="280" x2="80" y2="280" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="80" y="260" width="180" height="40" rx="6" fill="#f0b27a" stroke="#b9770e" stroke-width="1.5"/>
  <text x="95" y="286" font-size="17" font-family="Courier New, monospace" font-weight="bold" fill="#2c3e50">output/</text>
  <text x="360" y="286" font-size="14" fill="#566573">generated tables, figures, reports</text>

  <text x="20" y="345" font-size="14" font-style="italic" fill="#566573">Every exercise in this course references data/ the same way —</text>
  <text x="20" y="365" font-size="14" font-style="italic" fill="#566573">no matter whose computer the folder lives on.</text>
</svg>
