<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- LONG (tidy) table -->
  <text x="20" y="25" font-size="20" font-weight="700" fill="#2c3e50">Long format (tidy)</text>
  <text x="20" y="45" font-size="14" font-style="italic" fill="#566573">one row per observation</text>

  <g transform="translate(20,60)">
    <rect x="0" y="0" width="120" height="34" fill="#2c3e50"/>
    <rect x="120" y="0" width="150" height="34" fill="#2c3e50"/>
    <rect x="270" y="0" width="120" height="34" fill="#2c3e50"/>
    <text x="10" y="22" font-size="16" font-weight="700" fill="#ffffff">mrn</text>
    <text x="130" y="22" font-size="16" font-weight="700" fill="#ffffff">test</text>
    <text x="280" y="22" font-size="16" font-weight="700" fill="#ffffff">value</text>

    <rect x="0" y="34" width="120" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="120" y="34" width="150" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="270" y="34" width="120" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="10" y="55" font-size="15" fill="#2c3e50">121444</text>
    <text x="130" y="55" font-size="15" fill="#2c3e50">sodium</text>
    <text x="280" y="55" font-size="15" fill="#2c3e50">140</text>

    <rect x="0" y="66" width="120" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="120" y="66" width="150" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="270" y="66" width="120" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <text x="10" y="87" font-size="15" fill="#2c3e50">121444</text>
    <text x="130" y="87" font-size="15" fill="#2c3e50">potassium</text>
    <text x="280" y="87" font-size="15" fill="#2c3e50">4.1</text>

    <rect x="0" y="98" width="120" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="120" y="98" width="150" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="270" y="98" width="120" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="10" y="119" font-size="15" fill="#2c3e50">121444</text>
    <text x="130" y="119" font-size="15" fill="#2c3e50">chloride</text>
    <text x="280" y="119" font-size="15" fill="#2c3e50">102</text>

    <rect x="0" y="130" width="120" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="120" y="130" width="150" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="270" y="130" width="120" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <text x="10" y="151" font-size="15" fill="#2c3e50">130221</text>
    <text x="130" y="151" font-size="15" fill="#2c3e50">sodium</text>
    <text x="280" y="151" font-size="15" fill="#2c3e50">138</text>

    <rect x="0" y="162" width="120" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="120" y="162" width="150" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="270" y="162" width="120" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="10" y="183" font-size="15" fill="#2c3e50">130221</text>
    <text x="130" y="183" font-size="15" fill="#2c3e50">potassium</text>
    <text x="280" y="183" font-size="15" fill="#2c3e50">3.9</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(450,140)">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="5" y="-12" font-size="13" fill="#7f8c8d">pivot_wider()</text>
    <line x1="90" y1="30" x2="0" y2="30" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead2)"/>
    <text x="5" y="50" font-size="13" fill="#7f8c8d">pivot_longer()</text>
  </g>

  <!-- WIDE table -->
  <text x="600" y="25" font-size="20" font-weight="700" fill="#2c3e50">Wide format</text>
  <text x="600" y="45" font-size="14" font-style="italic" fill="#566573">one row per patient</text>

  <g transform="translate(600,60)">
    <rect x="0" y="0" width="90" height="34" fill="#2c3e50"/>
    <rect x="90" y="0" width="100" height="34" fill="#2c3e50"/>
    <rect x="190" y="0" width="100" height="34" fill="#2c3e50"/>
    <rect x="290" y="0" width="100" height="34" fill="#2c3e50"/>
    <text x="10" y="22" font-size="16" font-weight="700" fill="#ffffff">mrn</text>
    <text x="100" y="22" font-size="16" font-weight="700" fill="#ffffff">sodium</text>
    <text x="196" y="22" font-size="16" font-weight="700" fill="#ffffff">potassium</text>
    <text x="300" y="22" font-size="16" font-weight="700" fill="#ffffff">chloride</text>

    <rect x="0" y="34" width="90" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="90" y="34" width="100" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="190" y="34" width="100" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <rect x="290" y="34" width="100" height="32" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="10" y="55" font-size="15" fill="#2c3e50">121444</text>
    <text x="100" y="55" font-size="15" fill="#2c3e50">140</text>
    <text x="196" y="55" font-size="15" fill="#2c3e50">4.1</text>
    <text x="300" y="55" font-size="15" fill="#2c3e50">102</text>

    <rect x="0" y="66" width="90" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="90" y="66" width="100" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="190" y="66" width="100" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <rect x="290" y="66" width="100" height="32" fill="#f4f6f7" stroke="#d5d8dc"/>
    <text x="10" y="87" font-size="15" fill="#2c3e50">130221</text>
    <text x="100" y="87" font-size="15" fill="#2c3e50">138</text>
    <text x="196" y="87" font-size="15" fill="#2c3e50">3.9</text>
    <text x="300" y="87" font-size="15" fill="#c0392b" font-style="italic">NA</text>
  </g>

  <text x="600" y="240" font-size="14" font-style="italic" fill="#566573">chloride wasn't ordered for patient 130221 —</text>
  <text x="600" y="258" font-size="14" font-style="italic" fill="#566573">wide format forces an explicit NA cell</text>

  <text x="20" y="280" font-size="14" fill="#566573">Same underlying facts. Different shapes suit different tasks.</text>
</svg>
