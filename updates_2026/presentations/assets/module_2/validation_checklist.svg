<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <!-- Six steps as a checklist -->
  <g font-size="15" fill="#2c3e50">
    <!-- Step 1 -->
    <g transform="translate(0,0)">
      <circle cx="24" cy="24" r="20" fill="#2980b9"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="58" y="20" font-weight="700">Row count</text>
      <text x="58" y="42" font-size="13" fill="#566573" font-family="Courier New, monospace">nrow(chem)</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(0,65)">
      <circle cx="24" cy="24" r="20" fill="#2980b9"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="58" y="20" font-weight="700">Distinct patients</text>
      <text x="58" y="42" font-size="13" fill="#566573" font-family="Courier New, monospace">n_distinct(chem$mrn)</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(0,130)">
      <circle cx="24" cy="24" r="20" fill="#2980b9"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="58" y="20" font-weight="700">Analyte coverage</text>
      <text x="58" y="42" font-size="13" fill="#566573" font-family="Courier New, monospace">count(chem, test)</text>
    </g>
    <!-- Step 4 -->
    <g transform="translate(0,195)">
      <circle cx="24" cy="24" r="20" fill="#2980b9"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="58" y="20" font-weight="700">Patient type / missingness</text>
      <text x="58" y="42" font-size="13" fill="#566573" font-family="Courier New, monospace">count(chem, pat_type)</text>
    </g>
    <!-- Step 5 -->
    <g transform="translate(0,260)">
      <circle cx="24" cy="24" r="20" fill="#2980b9"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
      <text x="58" y="20" font-weight="700">Value range by test</text>
      <text x="58" y="42" font-size="13" fill="#566573" font-family="Courier New, monospace">group_by(test) |&gt; summarize(...)</text>
    </g>
    <!-- Step 6 -->
    <g transform="translate(0,325)">
      <circle cx="24" cy="24" r="20" fill="#2980b9"/>
      <text x="24" y="30" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
      <text x="58" y="20" font-weight="700">Timestamp completeness</text>
      <text x="58" y="42" font-size="13" fill="#566573" font-family="Courier New, monospace">summarize(missing = sum(is.na(...)))</text>
    </g>
  </g>

  <!-- Right column: framing -->
  <g transform="translate(560,60)">
    <rect width="420" height="260" rx="12" fill="#f4f8fb" stroke="#16a085" stroke-width="2"/>
    <text x="24" y="40" font-size="17" font-weight="700" fill="#16a085">Think of it as a signed receipt</text>
    <text x="24" y="80" font-size="14" fill="#2c3e50">You are documenting — in writing —</text>
    <text x="24" y="104" font-size="14" fill="#2c3e50">that the data arrived in the shape</text>
    <text x="24" y="128" font-size="14" fill="#2c3e50">you expected, before any analysis</text>
    <text x="24" y="152" font-size="14" fill="#2c3e50">begins.</text>
    <text x="24" y="196" font-size="14" font-style="italic" fill="#7f8c8d">Skipping this step doesn't make</text>
    <text x="24" y="220" font-size="14" font-style="italic" fill="#7f8c8d">problems disappear — it just means</text>
    <text x="24" y="244" font-size="14" font-style="italic" fill="#7f8c8d">you find them later, downstream.</text>
  </g>
</svg>
